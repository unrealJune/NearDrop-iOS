name: LiftDrop
options:
  bundleIdPrefix: com.unrealjune
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.27.0
  SwiftECC:
    url: https://github.com/leif-ibsen/SwiftECC.git
    from: 3.0.0
targets:
  NearbyShareCore:
    type: framework
    platform: iOS
    sources:
      - path: NearbyShare
        excludes:
          - ProtobufSource
          - GenerateProtobuf.sh
    dependencies:
      - package: SwiftProtobuf
      - package: SwiftECC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unrealjune.takeoff.NearbyShareCore
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true
  LiftDrop:
    type: application
    platform: iOS
    sources:
      - path: Sources/LiftDropApp
      - path: Sources/SharedUI
    dependencies:
      - target: NearbyShareCore
      - target: LiftDropShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unrealjune.takeoff
        PRODUCT_NAME: LiftDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/LiftDropApp/LiftDrop.entitlements
        INFOPLIST_FILE: Sources/LiftDropApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  LiftDropShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LiftDropShareExtension
      - path: Sources/SharedUI
    dependencies:
      - target: NearbyShareCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unrealjune.takeoff.ShareExtension
        PRODUCT_NAME: LiftDropShareExtension
        CODE_SIGN_ENTITLEMENTS: Sources/LiftDropShareExtension/LiftDropShareExtension.entitlements
        INFOPLIST_FILE: Sources/LiftDropShareExtension/Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  LiftDrop:
    build:
      targets:
        LiftDrop: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
