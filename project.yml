name: Takeoff
options:
  bundleIdPrefix: com.junephilip
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.27.0
  SwiftECC:
    url: https://github.com/leif-ibsen/SwiftECC.git
    from: 3.0.0
targets:
  NearbyShareCore:
    type: framework
    platform: iOS
    sources:
      - path: NearbyShare
        excludes:
          - ProtobufSource
          - GenerateProtobuf.sh
    dependencies:
      - package: SwiftProtobuf
      - package: SwiftECC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junephilip.Takeoff.NearbyShareCore
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true
  Takeoff:
    type: application
    platform: iOS
    sources:
      - path: Sources/TakeoffApp
      - path: Sources/SharedUI
    dependencies:
      - target: NearbyShareCore
      - target: TakeoffShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junephilip.Takeoff
        PRODUCT_NAME: Takeoff
        CODE_SIGN_ENTITLEMENTS: Sources/TakeoffApp/Takeoff.entitlements
        INFOPLIST_FILE: Sources/TakeoffApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  TakeoffShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TakeoffShareExtension
      - path: Sources/SharedUI
    dependencies:
      - target: NearbyShareCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junephilip.Takeoff.ShareExtension
        PRODUCT_NAME: TakeoffShareExtension
        CODE_SIGN_ENTITLEMENTS: Sources/TakeoffShareExtension/TakeoffShareExtension.entitlements
        INFOPLIST_FILE: Sources/TakeoffShareExtension/Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1,2"
